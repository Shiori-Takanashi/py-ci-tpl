[project]
name = "py-ci-tpl"
version = "0.1.0"
description = "Python template for code quality and CI using uv."
readme = "README.md"
authors = [
    { name = "Takanashi", email = "tnbirds314@gmail.com" }
]
requires-python = "==3.15.*"
dependencies = []

[build-system]
requires = ["uv_build==0.13.*"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff==0.17.*",
]

[tool.uv]
required-version = "==0.13.*"

[tool.ruff]
include = [
    "src/**/*.py",
    "tests/**/*.py",
    "scripts/**/*.py",
    "pyproject.toml",
]
cache-dir = ".dev_cache/.ruff_cache"
line-length = 88
indent-width = 4

target-version = "py315"
